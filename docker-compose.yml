# Servicios de desarrollo local. Uso: `docker compose up -d`
#   Postgres  → localhost:5434  (BD eia_dev y eia_test; usuario/clave: eia/eia)
#   MinIO S3  → API http://localhost:9000, consola http://localhost:9001 (eia / eia-secret-key)
#   Mailpit   → SMTP localhost:1025, UI http://localhost:8025
# Puertos configurables con variables (p. ej. POSTGRES_PORT=5434 docker compose up -d).
name: itinerantes-backend

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eia
      POSTGRES_PASSWORD: eia
      POSTGRES_DB: eia_dev
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eia -d eia_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO dejó de publicar imágenes en Docker Hub/Quay; se usa la imagen de Chainguard.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: eia
      MINIO_ROOT_PASSWORD: eia-secret-key
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data

  # Crea los buckets de dev y test (idempotente) y termina. Reintenta hasta que MinIO esté listo.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    restart: on-failure
    environment:
      MC_HOST_local: http://eia:eia-secret-key@minio:9000
    command: ['mb', '--ignore-existing', 'local/eia-dev', 'local/eia-test']

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  postgres-data:
  minio-data:
