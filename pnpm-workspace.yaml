# Configuración de pnpm (v10+ bloquea scripts de instalación por defecto).
allowBuilds:
  '@prisma/engines': true
  prisma: true
  unrs-resolver: true
  argon2: true
  '@parcel/watcher': false
  '@scarf/scarf': false
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1154.0'
  - '@aws-sdk/s3-request-presigner@3.1154.0'
